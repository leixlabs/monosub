[package]
name = "monosub"
version = "2.0.2"
description = "Local voice to article desktop app"
authors = ["VoiceToText"]
license = "PolyForm-Small-Business-1.0.0"
edition = "2021"
# `tauri dev` runs `cargo run` without `--bin`, and with two binaries Cargo
# refuses to guess. The GUI is the one a bare `cargo run` must start; the CLI is
# always requested explicitly (`cargo run --bin monosub-cli`).
default-run = "monosub"

# The GUI binary stays the default; the CLI is a second binary over the same
# library (src/lib.rs), which is why the modules had to leave main.rs.
[[bin]]
name = "monosub"
path = "src/main.rs"

[[bin]]
name = "monosub-cli"
path = "src/bin/monosub-cli.rs"

[lib]
name = "monosub"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
window-vibrancy = "0.6"
tauri-plugin-dialog = { version = "2" }
tauri-plugin-shell = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
lazy_static = "1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
tauri-plugin-notification = "2"
hound = "3.5"
# URL parsing for the import whitelist (`site::url`) — normalising a pasted
# link by hand is how `?p=3` and tracking parameters get confused.
url = "2.5"
futures-util = "0.3"

# Debug-only UI testing/automation bridge (tauri-pilot). Inert in release builds.
tauri-plugin-pilot = { git = "https://github.com/mpiton/tauri-pilot", tag = "v0.8.1" }
tauri-plugin-clipboard-manager = "2.5.0"
# Single instance: a second launch (shortcut double-click, taskbar pin, or a
# second `tauri dev`) must not start a rival process with its own tray icon and
# its own copy of the queue. On Windows this is a named mutex + window probe;
# the plugin hands the new process's argv to the instance that already owns the
# name and exits the new one.
tauri-plugin-single-instance = "2"

# Test-only: fixtures fill `ModelFile::sha256`, which the downloader no longer
# compares against (see `commands::models` module docs), so nothing at runtime
# hashes a model file any more.
[dev-dependencies]
sha2 = "0.10"

[profile.dev]
incremental = true
[features]
# `tauri-app` gates `AppPaths::from_app`, the one place the core needs a Tauri
# handle. The GUI enables it; a CLI binary compiles without it so the shared
# modules stay Tauri-free.
default = ["tauri-app"]
tauri-app = []
# Mac App Store build only: StoreKit 2 in-app purchase. The dependency is
# target-specific and optional, so the DMG / Windows / CLI builds don't compile
# the Swift bridge (which needs Xcode 26.4+).
appstore = ["dep:storekit-rs"]

# Security-scoped bookmarks (`bookmark.rs`): a sandbox grant is process-local, so
# remembering a user-chosen folder needs NSURL bookmarks. macOS only — every other
# platform stores plain paths.
[target.'cfg(target_os = "macos")'.dependencies]
# StoreKit 2 bindings for the Mac App Store build. `appstore` feature only;
# see `src/commands/iap/` and docs/release/macos-iap-plan.md.
storekit-rs = { version = "=0.5.2", optional = true }
objc2 = "0.6"
# 「在访达中显示 / 打开文件夹」：沙盒里 /usr/bin/open 拿不到 LaunchServices 授权，
# 只有 NSWorkspace 能把容器内的路径交给 Finder。
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSError",
    "NSString",
    "NSURL",
] }
