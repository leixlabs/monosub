[package]
name = "monosub"
version = "2.0.1"
description = "Local voice to article desktop app"
authors = ["VoiceToText"]
edition = "2021"
# `tauri dev` runs `cargo run` without `--bin`, and with two binaries Cargo
# refuses to guess. The GUI is the one a bare `cargo run` must start; the CLI is
# always requested explicitly (`cargo run --bin monosub-cli`).
default-run = "monosub"

# The GUI binary stays the default; the CLI is a second binary over the same
# library (src/lib.rs), which is why the modules had to leave main.rs.
[[bin]]
name = "monosub"
path = "src/main.rs"

[[bin]]
name = "monosub-cli"
path = "src/bin/monosub-cli.rs"

[lib]
name = "monosub"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
window-vibrancy = "0.6"
tauri-plugin-dialog = { version = "2" }
tauri-plugin-shell = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
lazy_static = "1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
sha2 = "0.10"
tauri-plugin-notification = "2"
hound = "3.5"
# URL parsing for the import whitelist (`site::url`) — normalising a pasted
# link by hand is how `?p=3` and tracking parameters get confused.
url = "2.5"
futures-util = "0.3"

# Debug-only UI testing/automation bridge (tauri-pilot). Inert in release builds.
tauri-plugin-pilot = { git = "https://github.com/mpiton/tauri-pilot", tag = "v0.8.1" }
tauri-plugin-clipboard-manager = "2.5.0"

[profile.dev]
incremental = true

[features]
# `tauri-app` gates `AppPaths::from_app`, the one place the core needs a Tauri
# handle. The GUI enables it; a CLI binary compiles without it so the shared
# modules stay Tauri-free.
default = ["tauri-app"]
tauri-app = []
